<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发送自定义邮件</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#1e293b;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:480px;background:#334155;padding:24px;border-radius:12px}
h2{margin-bottom:20px;text-align:center}
.item{margin-bottom:16px}
label{display:block;margin-bottom:6px;color:#cbd5e1}
input,textarea{width:100%;padding:12px;border:none;border-radius:8px;font-size:16px;background:#475569;color:#fff}
textarea{min-height:140px;resize:vertical}
button{width:100%;padding:14px;background:#2563eb;color:white;border:none;border-radius:8px;font-size:17px;margin-top:8px}
button:active{background:#1d4ed8}
.tip{margin-top:12px;font-size:13px;color:#94a3b8;text-align:center}
</style>
</head>
<body>
<div class="card">
<h2>发送邮件</h2>
<div class="item">
<label>收件邮箱</label>
<input type="email" id="email" placeholder="请输入邮箱地址">
</div>
<div class="item">
<label>自定义邮件内容（可自行修改）</label>
<textarea id="msg" placeholder="在这里写你要发送的文字……">你好，这是一条来自网页发送的测试消息。</textarea>
</div>
<button id="sendBtn">发送邮件</button>
<div class="tip">⚠️本页面仅UI界面，还未真正实现发信，需要接入邮件服务后端</div>
</div>

<script>
const emailInput = document.getElementById('email');
const msgInput = document.getElementById('msg');
const sendBtn = document.getElementById('sendBtn');

sendBtn.onclick = async ()=>{
  const to = emailInput.value.trim();
  const text = msgInput.value.trim();
  if(!to){
    alert('请填写邮箱');
    return;
  }
  if(!text){
    alert('请填写邮件内容');
    return;
  }

  // 这里只是前端获取数据，浏览器不能直接发邮件
  console.log('待发送：收件人',to,'内容：',text);
  alert(`收集完成！\n收件：${to}\n内容：${text}\n\n需要后端接口才可以真实发出邮件。`);

  /*
  // 示例伪代码：如果你有后端发信接口，取消下面注释调用
  // const res = await fetch("/api/sendmail",{
  //   method:"POST",
  //   headers:{"Content-Type":"application/json"},
  //   body:JSON.stringify({to,text})
  // });
  */
}
</script>
</body>
</html>
